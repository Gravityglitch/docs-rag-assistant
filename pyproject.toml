[project]
name = "docs-rag-assistant"
version = "0.1.0"
description = "RAG knowledge assistant over PDF/DOCX/Markdown with hybrid retrieval, page-level citations, abstention and an offline eval harness."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "numpy>=2.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.30",
]

[project.scripts]
rag = "rag.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
