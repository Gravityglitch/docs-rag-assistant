[project]
name = "docs-rag-assistant"
version = "1.0.0"
description = "RAG knowledge assistant over PDF/DOCX/Markdown with hybrid retrieval, page-level citations, abstention and an offline eval harness."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "numpy>=2.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "slowapi>=0.1.9",
    "sse-starlette>=2.1",
    "structlog>=24.0",
    "tenacity>=9.0",
    "uvicorn>=0.30",
]

[project.scripts]
rag = "rag.cli:main"

[project.optional-dependencies]
metrics = [
    "prometheus-fastapi-instrumentator>=7.0",
]
rerank = [
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pg: needs a live Postgres+pgvector (TEST_DATABASE_URL); skipped otherwise"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["rag"]
omit = ["rag/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]
