services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      RAG_DOCS_DIR: /app/docs
      RAG_LOG_JSON: "true"
    volumes:
      - ./docs:/app/docs:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
